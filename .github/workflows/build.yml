name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux / Mono, C# 5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Mono and NSIS
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends mono-devel libgdiplus nsis
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r test/requirements.txt
      - run: bash test/run-tests.sh
      - uses: actions/upload-artifact@v5
        with:
          name: key-gallery
          path: build/gallery/

  build-windows:
    name: Build, sign (optional) and test on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Make sure NSIS is installed
        shell: powershell
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Build AIUsage.exe (Windows csc.exe) and the installer
        shell: powershell
        env:
          # Optional code signing: add these repository secrets to sign the exe and the installer.
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: .\build.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: End-to-end test on .NET Framework
        run: |
          pip install -r test/requirements.txt
          python test/fake_host.py com.saeedsh.aiusage.sdPlugin/AIUsage.exe
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: installer
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (e.g. drafted on github.com); then just attach the files.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
          fi
